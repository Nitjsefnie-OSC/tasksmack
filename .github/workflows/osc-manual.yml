# OSC fork CI wrapper - generated by scripts/make_wrapper.py;
# check with scripts/verify_wrapper.py before pushing.
# Jobs kept (verbatim, except the two sanctioned adaptations:
# checkout pinned to ${{ inputs.target_ref }}, and the inserted
# Provenance step):
#   - detect-docs-only [no checkout step - no Provenance step added, none invented]
#   - docs-hygiene
# DELIBERATELY EXCLUDED (loud):
#   - build-linux-debug: calls a reusable workflow (uses: ./.github/workflows/reusable-build-test.yml) - its checkout is not pinned to target_ref and it has no provenance
#   - build-linux-release: calls a reusable workflow (uses: ./.github/workflows/reusable-build-test.yml) - its checkout is not pinned to target_ref and it has no provenance
#   - build-windows-debug: calls a reusable workflow (uses: ./.github/workflows/reusable-build-test.yml) - its checkout is not pinned to target_ref and it has no provenance
#   - build-windows-release: calls a reusable workflow (uses: ./.github/workflows/reusable-build-test.yml) - its checkout is not pinned to target_ref and it has no provenance; if: only fires on schedule, so it is skipped under workflow_dispatch
#   - build-linux-unity: calls a reusable workflow (uses: ./.github/workflows/reusable-build-test.yml) - its checkout is not pinned to target_ref and it has no provenance; if: only fires on schedule, so it is skipped under workflow_dispatch; reads event payloads a workflow_dispatch does not carry
#   - static-analysis-windows: needs excluded job build-windows-debug
#   - include-analysis: needs excluded job build-linux-debug
#   - asan-ubsan: if: only fires on pull_request, so it is skipped under workflow_dispatch
#   - ci-success: needs excluded job build-linux-debug

name: OSC manual CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
jobs:
  detect-docs-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.set_output.outputs.docs_only }}
      linux_only: ${{ steps.set_output.outputs.linux_only }}
      windows_only: ${{ steps.set_output.outputs.windows_only }}
    steps:
    - name: Detect docs-only and platform-only pull request changes
      id: filter
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
      with:
        predicate-quantifier: every
        filters: |
          outside_docs:
            - '**'
            - '!**/*.md'
            - '!docs/**'
            - '!.github/ISSUE_TEMPLATE/**'
            - '!.github/pull_request_template.md'
            - '!.github/PULL_REQUEST_TEMPLATE/**'
            - '!LICENSE'
          # Only a platform's .cpp files are its own. Its headers can be compiled into the other
          # OS's build: the shared test binary includes about 20 header-only Linux parsers
          # (test_LinuxOsInfo.cpp and others in COMMON_TEST_SOURCES), and Linux builds the Windows
          # *Math.h headers (WINDOWS_MATH_TEST_SOURCES). So a header change runs both OSes' builds,
          # or a break in the other OS's compile would only show on main (#2130).
          outside_linux_platform:
            - '**'
            - '!src/Platform/Linux/**/*.cpp'
          outside_windows_platform:
            - '**'
            - '!src/Platform/Windows/**/*.cpp'
    - name: Normalize outputs
      id: set_output
      env:
        HEAD_REF: ${{ github.head_ref }}
      run: |
        # steps.filter only ran (see its own `if:`) for pull_request events.
        emit_platform_outputs() {
          # A set's "only" output is true when no changed file lies outside it (see the filter
          # step). paths-filter reports 'false' for a filter no file matched, and an empty
          # change set can't occur for a pull request.
          if [[ "${{ steps.filter.outputs.outside_docs }}" = 'false' ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ steps.filter.outputs.outside_linux_platform }}" = 'false' ]]; then
            echo "linux_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "linux_only=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ steps.filter.outputs.outside_windows_platform }}" = 'false' ]]; then
            echo "windows_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_only=false" >> "$GITHUB_OUTPUT"
          fi
        }

        if [[ "${{ github.event_name }}" = 'pull_request' ]]; then
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" && \
                "${{ github.event.pull_request.user.login }}" = 'github-actions[bot]' && \
                "${HEAD_REF}" == chore/changelog-* ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "linux_only=false" >> "$GITHUB_OUTPUT"
            echo "windows_only=false" >> "$GITHUB_OUTPUT"
          else
            emit_platform_outputs
          fi
        else
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "linux_only=false" >> "$GITHUB_OUTPUT"
          echo "windows_only=false" >> "$GITHUB_OUTPUT"
        fi
  docs-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - name: Audit markdown links
      run: ./tools/md-link-audit.sh
